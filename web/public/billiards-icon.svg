<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="feltBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e7053"/>
      <stop offset="100%" stop-color="#06281e"/>
    </radialGradient>
    <radialGradient id="ballShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <radialGradient id="eightShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0c131c" stroke="#1e293b" stroke-width="2"/>
  <circle cx="32" cy="32" r="26" fill="url(#feltBg)" stroke="#0e7053" stroke-width="1.5"/>
  <!-- Cue Ball -->
  <circle cx="23" cy="36" r="11" fill="url(#ballShine)" stroke="#ffffff" stroke-width="0.5"/>
  <!-- 8 Ball -->
  <circle cx="39" cy="27" r="12" fill="url(#eightShine)" stroke="#475569" stroke-width="0.5"/>
  <circle cx="39" cy="27" r="5" fill="#ffffff"/>
  <text x="39" y="30" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle" fill="#000000">8</text>
  <!-- Collision Impulse Vector -->
  <line x1="28" y1="32" x2="33" y2="29" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
</svg>
